[project]
name = "tsumugi"
version = "0.1.0"
description = "Offline visual-novel translation toolchain: point it at an installed Japanese VN, get a playable English patch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42",
]

[project.scripts]
tsumugi = "tsumugi.cli.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pyright>=1.1.390",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsumugi"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.pyright]
include = ["tsumugi", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = true
